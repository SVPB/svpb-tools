<?xml version="1.0" encoding="UTF-8"?>
<!--
  Probe for verify-image-rendering.sh.

  A verbatim excerpt of CeolKit's own output: three real glyph outlines in
  <defs> (a treble clef and an accidental from Bravura, a capital T from
  Libertinus Serif) drawn by <use>, exactly as the renderer emits them —
  TextRendering.outlines, so no @font-face block and no <text> element.

  That shape is the point. The image under test never resolves a font family,
  so the only host-side behaviour left to verify is that its rsvg-convert
  honours <use href> and puts the referenced geometry on the page. The script
  converts this file and a control copy with the <use> elements stripped; a
  rasteriser that drew the glyphs produces the substantially larger PDF.

  Regenerate by rendering any score and lifting the <defs>/<use> pairs out of
  the emitted SVG.
-->

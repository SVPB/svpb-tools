name: Publish image

# Builds the deployment image and pushes it to the GitHub Container Registry.
# The droplet pulls from there — it never compiles Swift itself.
#
# Resulting tags:
#   ghcr.io/svpb/svpb-tools:main       every push to main: integration, not a release
#   ghcr.io/svpb/svpb-tools:0.2.0      pushes of a v0.2.0 tag
#   ghcr.io/svpb/svpb-tools:latest     pushes of a release tag (vX.Y.Z) only
#
# `latest` is the newest release, and production runs it (#108). A merge to main
# must never move it, or every merge would be one deploy.sh away from production.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only a plain vX.Y.Z tag is a release. GitHub expressions have no regex,
      # so the test is made here and passed to metadata-action as a flag.
      - name: Is this a release?
        id: release
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # metadata-action adds `latest` on its own for some tag types; this
          # workflow decides it explicitly instead.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_release }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Droplets are x86_64. Building arm64 as well would double the job
          # time for an image nothing runs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The server reports this in /health and its page footers (#65).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
